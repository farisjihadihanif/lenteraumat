# Ganti domainmu.id dengan domain asli, lalu jalankan certbot (lihat DEPLOY.md).
server {
    listen 80;
    server_name domainmu.id www.domainmu.id;

    # Unggah PDF sampai 40 MB, lampiran LUMA sampai 4 x 50 MB.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ringkasan & kuis LUMA dari buku tebal bisa lebih dari 1 menit.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
