name: lenteraumat
description: "LenteraUmat: perpustakaan digital (Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  connectivity_plus: ^7.3.2
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  pdfrx: ^3.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Literata.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
          weight: 400
        - asset: assets/fonts/Literata-600.ttf
          weight: 600
        - asset: assets/fonts/Literata-700.ttf
          weight: 700
